name: Compilar APK e NaviPC

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Baixar modelo de voz em português (Vosk, offline)
        run: |
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q model.zip -d model_tmp
          mkdir -p app/src/main/assets
          mv model_tmp/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          echo "pt-0.3-${GITHUB_SHA}" > app/src/main/assets/model-pt/uuid

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.NAVI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NAVI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > app/navi-release.keystore
            {
              echo "storeFile=navi-release.keystore"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=navi"
              echo "keyPassword=$KS_PASS"
            } > app/signing.properties
            echo "🔐 APK assinado com a chave nova (segredo do repositório)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ APK assinado com a chave antiga, que já foi pública. Rode tools/nova-chave-assinatura.ps1 (veja o README)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          echo '## Erros de compilação' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |error:|ERROR:|What went wrong|Execution failed|Unresolved|AAPT' build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | head -40 | while IFS= read -r line; do
            f=$(echo "$line" | sed -E 's#^e: (file://)?([^:]+):([0-9]+):([0-9]+).*#\2#')
            l=$(echo "$line" | sed -E 's#^e: (file://)?([^:]+):([0-9]+):([0-9]+).*#\3#')
            m=$(echo "$line" | sed -E 's#^e: (file://)?[^ ]+ (.*)#\2#')
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=$l::$m"
          done

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Navi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Navi
          path: Navi.apk

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pc/requirements.txt pyinstaller

      - name: Autoteste pelo Python
        working-directory: pc
        shell: pwsh
        run: |
          python navi_pc.py --teste --silencioso --ci
          $code = $LASTEXITCODE
          Get-Content "$env:APPDATA\NaviPC\autoteste.txt" -Encoding utf8
          if ($code -ne 0) { exit $code }

      - name: Gerar NaviPC.exe
        working-directory: pc
        run: >
          pyinstaller --onefile --noconsole --name NaviPC
          --hidden-import janelas --hidden-import audio_win --hidden-import jogos --hidden-import tela
          --hidden-import monitor --hidden-import telas --hidden-import pystray._win32 --collect-submodules screen_brightness_control
          navi_pc.py

      - name: Autoteste do NaviPC.exe (o arquivo que vai para o PC)
        shell: pwsh
        run: |
          Remove-Item "$env:APPDATA\NaviPC\autoteste.txt" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "pc\dist\NaviPC.exe" -ArgumentList "--teste","--silencioso","--ci" -Wait -PassThru
          Get-Content "$env:APPDATA\NaviPC\autoteste.txt" -Encoding utf8
          "## Autoteste do NaviPC.exe" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:APPDATA\NaviPC\autoteste.txt" -Encoding utf8 >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { Write-Error "Autoteste falhou (código $($p.ExitCode))"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: NaviPC
          path: pc/dist/NaviPC.exe

  release:
    if: github.ref == 'refs/heads/main' && always() && needs.android.result == 'success'
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publicar na release "apk" (link fixo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="out/Navi/Navi.apk"
          [ -f out/NaviPC/NaviPC.exe ] && files="$files out/NaviPC/NaviPC.exe"
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk $files \
            --title "Navi (build ${GITHUB_RUN_NUMBER})" \
            --notes "Celular: baixe o Navi.apk (ou rode o script do Termux). PC Windows: baixe o NaviPC.exe e abra." \
            --target "${GITHUB_SHA}" --latest
